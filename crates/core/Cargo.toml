[package]
name = "djcast-core"
description = "Audio capture, encoding and Icecast/Shoutcast streaming engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
crossbeam-channel.workspace = true
base64 = "0.23"
cpal = "0.18"
mp3lame-encoder = "0.3"
ebur128 = "0.1.11"
opus = "0.4"
ogg = "0.9"
rubato = "5"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation"] }
