[package]
name = "djcast-nowplaying"
description = "Now-playing detection for DJ software (rekordbox first)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.9.4"
anyhow.workspace = true
dirs = "7.0.0"
hmac = "0.13.0"
log.workspace = true
midir = "0.11"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
rusqlite = { version = "0.43.0", features = ["bundled", "serialize"] }
serde.workspace = true
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant", "Win32_Foundation"] }
