[package]
name = "djcast-nowplaying"
description = "Now-playing detection for DJ software (rekordbox first)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
midir = "0.11"
serde.workspace = true

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Foundation"] }

[target."cfg(target_os = \"macos\")".dependencies]
core-foundation = "0.10"
libc = "0.2"
