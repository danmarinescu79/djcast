[workspace]
resolver = "3"
members = ["crates/core", "crates/nowplaying", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
djcast-core = { path = "crates/core" }
djcast-nowplaying = { path = "crates/nowplaying" }
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
