[workspace]
resolver = "3"
members = ["crates/core", "crates/nowplaying", "crates/app", "crates/cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
djcast-core = { path = "crates/core" }
djcast-nowplaying = { path = "crates/nowplaying" }
djcast-app = { path = "crates/app" }
anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"

# Crypto (TLS) and the encoders are far too slow unoptimized;
# optimize dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3
