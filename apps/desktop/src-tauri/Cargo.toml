[package]
name = "djcast-desktop"
description = "djcast desktop app (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
djcast-app.workspace = true
djcast-core.workspace = true
djcast-nowplaying.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
env_logger = "0.11"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
