name: CI

# Checks contributions; installers are only built by the release workflow (v* tags).
on:
  pull_request:
  workflow_dispatch:
  # Only when dependencies change: refreshes the build cache on main, which pull requests
  # read from (a pull request's own cache is not shared with other pull requests).
  push:
    branches: [main]
    paths: ["Cargo.lock", "**/Cargo.toml", "apps/desktop/package-lock.json"]

# No secrets are used here; pull requests from forks run with a read-only token.
permissions:
  contents: read

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
          components: clippy
      # Reuse compiled dependencies between runs (the release workflow deliberately builds clean).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check-i18n
          npm run build
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
