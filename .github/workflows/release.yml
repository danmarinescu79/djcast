name: Release

# Builds signed installers for a version tag and publishes the GitHub release with the
# updater manifest (latest.json). The signing keys live in the protected `release`
# environment: each build job waits for the owner's approval before it can read them.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match version $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installers
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          npm ci
          npx tauri build

      - name: Collect the installers
        shell: bash
        run: |
          mkdir out
          b=target/release/bundle
          cp "$b/nsis/djcast_${VERSION}_x64-setup.exe" "$b/nsis/djcast_${VERSION}_x64-setup.exe.sig" \
            "$b/msi/djcast_${VERSION}_x64_en-US.msi" out/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
          # One app for Apple Silicon and Intel Macs.
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Check the tag matches the app version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')
          [ "v$version" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} does not match version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/notarize.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Tauri imports the certificate into a temporary keychain, signs with the hardened
      # runtime and notarizes the app (and staples the ticket) before making the updater archive.
      - name: Build, sign and notarize
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          npm ci
          npx tauri build --target universal-apple-darwin

      - name: Notarize the disk image
        env:
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          dmg="target/universal-apple-darwin/release/bundle/dmg/djcast_${VERSION}_universal.dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"

      - name: Collect the app
        run: |
          mkdir out
          b=target/universal-apple-darwin/release/bundle
          cp "$b/dmg/djcast_${VERSION}_universal.dmg" out/
          cp "$b/macos/djcast.app.tar.gz" "out/djcast_${VERSION}_universal.app.tar.gz"
          cp "$b/macos/djcast.app.tar.gz.sig" "out/djcast_${VERSION}_universal.app.tar.gz.sig"

      - name: Remove the notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/notarize.p8"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: out/
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-release
          merge-multiple: true

      - name: Release notes and updater manifest
        run: python3 .github/scripts/release_files.py "${GITHUB_REF_NAME#v}" dist-release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          d=dist-release
          gh release create "$GITHUB_REF_NAME" --title "djcast $v" --notes-file "$d/notes.md" --latest \
            "$d/djcast_${v}_x64-setup.exe" "$d/djcast_${v}_x64-setup.exe.sig" "$d/djcast_${v}_x64_en-US.msi" \
            "$d/djcast_${v}_universal.dmg" "$d/djcast_${v}_universal.app.tar.gz" \
            "$d/djcast_${v}_universal.app.tar.gz.sig" "$d/latest.json"
