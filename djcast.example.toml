# Copy to djcast.toml and fill in your server details.

[audio]
# Device name (a substring is enough). Empty = system default. See `djcast devices`.
device = ""
# "loopback" = capture what plays on an output device (e.g. your DJ controller's sound card)
# "input"    = capture an input (line-in, USB mixer input, virtual cable)
mode = "loopback"
gain = 1.0

[processing]
# Loudness processing before encoding (AGC + look-ahead limiter), like Winamp DSP / Stereo Tool.
# "off", "gentle" (-16 LUFS), "radio" (-13 LUFS, typical internet radio), "loud" (-10 LUFS),
# or "custom" (uses target_lufs). DJ mixes are often around -20..-26 LUFS without it.
preset = "radio"
target_lufs = -14.0
# Limiter ceiling; keep at -1.0 or lower so MP3 encoding does not clip
ceiling_db = -1.0
# Maximum boost the AGC may apply
max_gain_db = 15.0
# 4-band compression between the AGC and the limiter: denser, more even sound
multiband = false

[encoder]
codec = "mp3"
bitrate = 192   # 128, 192, 256, 320 ...

[server]
# "icecast", "shoutcast2" (DNAS 2, uses stream_id) or "shoutcast1".
# Shoutcast sends audio to port + 1 and uses only the password (no user / mount).
protocol = "icecast"
host = "localhost"
port = 8000
mount = "/live"
user = "source"
password = "hackme"
stream_id = 1
name = "My DJ Stream"
description = ""
genre = "Electronic"
url = ""
public = false
reconnect_delay_secs = 3

[record]
enabled = false
dir = "recordings"

[nowplaying]
# "none"           = titles only from manual input
# "rekordbox-db"   = rekordbox play history (stable; tracks appear ~1 min after they start)
# "rekordbox-live" = instant: decks read from the rekordbox window (Windows) + mixer via MIDI
# "auto"           = rekordbox-live, falling back to rekordbox-db when live is unavailable
source = "auto"
poll_interval_secs = 1.0
# Controller MIDI input for faders/crossfader: "auto" (first "DDJ" port), a port name, or "none"
midi_input = "auto"
# Seconds a deck must be clearly louder before the title switches to it
confirm_secs = 4.0
# Crossfader assign per channel until the switches are moved: "a", "thru" or "b"
crossfader_assign = ["thru", "thru", "thru", "thru"]
# Empty = use the key saved with `djcast rekordbox set-key` (see docs/rekordbox-key.md)
rekordbox_key = ""
# Empty = auto-detect
rekordbox_db = ""
# Folder for nowplaying.txt / artist.txt / title.txt (for OBS) and the session tracklist.
# Empty = disabled.
output_dir = "nowplaying"
